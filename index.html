<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Kaju Reklam Etiket Hesaplama"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><title>Kaju Reklam Etiket Hesaplama</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:18px 14px 40px}.header{background:#111827;color:white;border-radius:18px;padding:18px 18px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 6px 20px #0001}.header img{width:58px;height:58px;border-radius:14px;background:white}.header h1{font-size:21px;margin:0 0 4px}.header p{margin:0;color:#cbd5e1;font-size:13px}.card{background:white;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 3px 14px #0000000d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input,.field select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:11px;font-size:16px;background:white}.btn{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;background:#111827;color:#fff}.btn.secondary{background:#e5e7eb;color:#111827}.result{background:#f8fafc;border:1px solid #e2e8f0}.big{font-size:34px;font-weight:900}.muted{font-size:13px;color:#64748b;line-height:1.45}.note{margin-top:10px;padding:10px 12px;border-radius:10px;background:#fff7ed;color:#9a3412;font-size:13px;line-height:1.45}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.material{border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin-top:9px}.material input{padding:9px;font-size:14px}.danger{background:#fee2e2;color:#991b1b;border:0;border-radius:9px;padding:9px 10px;font-weight:700}.small{font-size:12px;color:#64748b}.hidden{display:none}.title{font-size:17px;font-weight:800;margin:0 0 10px}.footer{text-align:center;color:#94a3b8;font-size:11px;margin-top:18px}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.header h1{font-size:18px}}
</style></head><body><div class="wrap"><div class="header"><img src="icons/icon.png"><div><h1>Kaju Reklam Etiket Hesaplama</h1><p>310 × 430 mm tabaka hesabı</p></div></div>
<div class="card"><div class="grid"><div class="field"><label>Malzeme</label><select id="material"></select></div><div class="field"><label>Adet</label><input id="qty" type="number" min="1" value="1"></div><div class="field"><label>Etiket En (mm)</label><input id="w" type="number" min="1" value="230"></div><div class="field"><label>Etiket Boy (mm)</label><input id="h" type="number" min="1" value="150"></div><div class="field"><label>Boşluk</label><select id="gap"><option value="0">0 mm • Boşluksuz</option><option value="3">3 mm • Boşluklu</option></select></div></div><button class="btn" onclick="calculate()">HESAPLA</button></div>
<div id="resultCard" class="card result hidden"><div class="muted">Tabakaya sığan</div><div id="count" class="big">0 adet</div><div id="layout" class="muted"></div><div id="price" class="muted"></div><div id="note" class="note hidden"></div></div>
<div class="card"><div class="title">Fiyat Ayarları</div><div id="materials"></div><button class="btn secondary" onclick="addMaterial()">＋ Yeni Malzeme Ekle</button><div class="small" style="margin-top:8px">Fiyatlar TL / tabaka olarak kaydedilir.</div></div><div class="footer">Kaju Reklam Etiket Hesaplama</div></div>
<script>
const base=[['Kuşe Etiket',25],['PP Opak Etiket',35],['PP Şeffaf Etiket',35],['Metalize Etiket',50]];
let mats=JSON.parse(localStorage.getItem('mats')||'null')||base.map(x=>({name:x[0],price:x[1],base:true}));
const $=id=>document.getElementById(id); function save(){localStorage.setItem('mats',JSON.stringify(mats));render();}
function render(){ $('material').innerHTML=mats.map((m,i)=>`<option value="${i}">${esc(m.name)}</option>`).join(''); $('materials').innerHTML=mats.map((m,i)=>`<div class="material"><div class="row"><input id="mn${i}" value="${escAttr(m.name)}"><input id="mp${i}" type="number" min="0" step="0.01" value="${m.price}"><button class="danger" onclick="delMaterial(${i})">Sil</button></div></div>`).join(''); mats.forEach((m,i)=>{ $('mn'+i).onchange=()=>{m.name=$('mn'+i).value;save()}; $('mp'+i).onchange=()=>{m.price=Number($('mp'+i).value)||0;save()}; }); }
function addMaterial(){if(mats.length>=24)return alert('En fazla 24 malzeme ekleyebilirsiniz.');mats.push({name:'Yeni Malzeme',price:0,base:false});save();}
function delMaterial(i){if(mats[i].base)return alert('Varsayılan malzemeler silinemez; adını ve fiyatını değiştirebilirsiniz.');mats.splice(i,1);save();}
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))} function escAttr(s){return esc(s).replace(/'/g,'&#39;')}
function fit(L,x,g){if(x<=0)return 0;return Math.max(0,Math.floor((L+g)/(x+g)+1e-9));}
function normal(a,b,g){return fit(310,a,g)*fit(430,b,g)}
function mixed(a,b,g){let best=0; for(let A=0;A<=20;A++){for(let B=0;B<=20;B++){let usedH=A*b+(A? (A-1)*g:0);if(usedH>430+1e-9)continue;let rem=430-usedH;let rows=fit(rem,b,g); // second orientation block
let c=fit(310,b,g), d=fit(310,a,g); best=Math.max(best,A*fit(310,a,g),A*fit(310,a,g)+Math.min(rows,c));}}
// exhaustive two-block vertical/horizontal split
for(let split=1;split<310;split++){let left=split,right=310-split;best=Math.max(best,fit(left,a,g)*fit(430,b,g)+fit(right,b,g)*fit(430,a,g));best=Math.max(best,fit(left,b,g)*fit(430,a,g)+fit(right,a,g)*fit(430,b,g));}
return best;}
function perSheet(w,h,g){return Math.max(normal(w,h,g),normal(h,w,g),mixed(w,h,g));}
function costMultiplier(q){return q<=5?2:q<=20?1.75:q<=50?1.3:1;}
function fitsCount(w,h,g,n){return perSheet(w,h,g)>=n;}
function suggest(w,h,g,target){if(target<=perSheet(w,h,g))return null;let ratio=w/h,lo=.1,hi=Math.max(w,h);for(let i=0;i<55;i++){let mid=(lo+hi)/2,ww=mid,hh=mid/ratio;if(fitsCount(ww,hh,g,target))lo=mid;else hi=mid;}let ww=Math.round(lo*100)/100,hh=Math.round((lo/ratio)*100)/100;return [ww,hh];}
function calculate(){let w=Number($('w').value),h=Number($('h').value),g=Number($('gap').value),q=Math.max(1,Number($('qty').value)||1),m=mats[Number($('material').value)||0];if(!(w>0&&h>0))return alert('Ölçüleri girin.');let per=perSheet(w,h,g);$('resultCard').classList.remove('hidden');$('count').textContent=per+' adet';let n=normal(w,h,g),r=normal(h,w,g);let layout=per>Math.max(n,r)?'Karma / 90° Döndürülmüş':(n>=r?'Normal':'90° Döndürülmüş');$('layout').textContent='Dizilim: '+layout+' • Tabaka: 310 × 430 mm';let total=per?Math.ceil(q/per)*m.price*costMultiplier(Math.ceil(q/per)):0;$('price').textContent='Tahmini fiyat: '+total.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' TL';let note=$('note');if(per<=9){let parts=[];for(let t=per+1;t<=per+2;t++){let s=suggest(w,h,g,t);if(s)parts.push(`${t} adet için yaklaşık ${s[0]} × ${s[1]} mm yapabilirsiniz.`)}note.textContent=parts.join(' ');note.classList.toggle('hidden',parts.length===0)}else note.classList.add('hidden');}
render(); if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
